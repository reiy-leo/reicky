<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>reicky</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="list-window">
    <div id="pane-list" class="pane">
    <header class="lw-head" data-tauri-drag-region>
      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" /><path d="M16 16l4 4" /></svg>
        <input id="q" type="search" spellcheck="false" autocomplete="off" data-i18n-placeholder="search" />
      </div>
    </header>
    <div class="lw-filters" data-tauri-drag-region>
      <div id="chips" class="chips"></div>
    </div>
    <div class="list-scroll">
      <ul id="list" class="list"></ul>
      <div id="list-sentinel" class="sentinel"></div>
    </div>
    </div>
    <section id="pane-settings" class="pane settings" hidden>
      <header class="set-head" data-tauri-drag-region>
        <button id="btn-back" class="icon-btn" data-i18n-title="back">
          <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" /></svg>
        </button>
        <span class="set-title" data-i18n="settings"></span>
      </header>
      <div class="set-body">
        <div class="set-group">
          <div class="set-label" data-i18n="renderSection"></div>
          <label class="set-row"><span data-i18n="renderLinks"></span><input type="checkbox" class="switch" data-render="links" /></label>
          <label class="set-row"><span data-i18n="renderLists"></span><input type="checkbox" class="switch" data-render="lists" /></label>
          <label class="set-row"><span data-i18n="renderTodo"></span><input type="checkbox" class="switch" data-render="todo" /></label>
        </div>
        <div class="set-group">
          <div class="set-label" data-i18n="general"></div>
          <label class="set-row"><span data-i18n="autostart"></span><input id="autostart" type="checkbox" class="switch" /></label>
        </div>
        <div class="set-group">
          <div class="set-label" data-i18n="syncSection"></div>
          <label class="set-row"><span data-i18n="syncGoogle"></span><input id="sync-google" type="checkbox" class="switch" /></label>
          <div class="sync-info">
            <span id="sync-text" class="sync-text"></span>
            <button id="sync-now" class="link-btn" data-i18n="syncNow" hidden></button>
          </div>
        </div>
        <div class="set-group">
          <div class="set-label" data-i18n="trayIcon"></div>
          <div id="tray-styles" class="tray-styles" role="radiogroup"></div>
        </div>
      </div>
    </section>
    <footer class="lw-foot">
      <div id="tabs" class="tabs" role="tablist">
        <button class="tab active" data-archived="false" role="tab" data-i18n="tabNotes"></button>
        <button class="tab" data-archived="true" role="tab" data-i18n="tabArchived"></button>
      </div>
      <span id="status" class="status"></span>
      <button id="btn-new" class="icon-btn" data-i18n-title="newNote">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
          </button>
      <button id="btn-settings" class="icon-btn" data-i18n-title="settings">
        <svg viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" /><circle cx="12" cy="12" r="3" /></svg>
      </button>
      <button id="btn-quit" class="icon-btn" data-i18n-title="quit">
        <svg viewBox="0 0 24 24"><path d="M12 3v9M6.3 6.3a8 8 0 1 0 11.4 0" /></svg>
      </button>
    </footer>
    <script type="module" src="/src/list.ts"></script>
  </body>
</html>
