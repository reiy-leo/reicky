<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>reicky</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main id="note" class="note">
      <div class="grip" data-tauri-drag-region>
        <button id="btn-pin" class="icon-btn pin-btn" aria-pressed="true">
          <svg viewBox="0 0 24 24"><path d="M9 4h6l-1 5 3 3v2H7v-2l3-3zM12 14v6" /></svg>
        </button>
      </div>
      <textarea id="editor" class="editor" spellcheck="false" ></textarea>
      <div id="view" class="editor view" hidden></div>
      <ul id="paths" class="paths" aria-label="拖入的文件"></ul>
      <footer class="bar" data-tauri-drag-region>
        <div class="bar-left">
          <button id="btn-new" class="icon-btn" data-i18n-title="newNote">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
          </button>
          <button id="btn-color" class="icon-btn" data-i18n-title="color">
            <svg viewBox="0 0 24 24"><circle class="dot" cx="12" cy="12" r="6.5" /></svg>
          </button>
          <div id="palette" class="palette" hidden>
            <div id="swatches" class="swatches"></div>
            <div class="langs">
              <button class="theme-opt" data-theme-mode="system" data-i18n="themeSystem"></button>
              <button class="theme-opt" data-theme-mode="light" data-i18n="themeLight"></button>
              <button class="theme-opt" data-theme-mode="dark" data-i18n="themeDark"></button>
            </div>
            <div class="langs">
              <button class="lang" data-lang="zh">中文</button>
              <button class="lang" data-lang="en">EN</button>
            </div>
          </div>
          <button id="btn-shape" class="icon-btn" data-i18n-title="shape">
            <svg viewBox="0 0 24 24"><rect id="shape-icon" x="8" y="4" width="8" height="16" rx="1.5" /></svg>
          </button>
        </div>
        <span id="status" class="status" data-tauri-drag-region></span>
        <div class="bar-right">
          <button id="btn-big" class="icon-btn" data-i18n-title="bigType">
            <svg viewBox="0 0 24 24"><path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4M9.5 15.5 12 8.5l2.5 7M10.4 13h3.2" /></svg>
          </button>
          <button id="btn-copy" class="icon-btn" data-i18n-title="copy">
            <svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2" /><path d="M5 15V6a2 2 0 0 1 2-2h8" /></svg>
          </button>
          <button id="btn-paste" class="icon-btn" data-i18n-title="paste">
            <svg viewBox="0 0 24 24"><path d="M9 4h6v3H9zM9 5.5H6a1 1 0 0 0-1 1V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V6.5a1 1 0 0 0-1-1h-3M9 12h6M9 16h4" /></svg>
          </button>
          <button id="btn-archive" class="icon-btn" data-i18n-title="archive">
            <svg viewBox="0 0 24 24"><path d="M3 4h18v4H3zM5 8v12h14V8M10 12h4" /></svg>
          </button>
          <button id="btn-stow" class="icon-btn" data-i18n-title="stow">
            <svg viewBox="0 0 24 24"><path d="M7 7l5 5 5-5M7 13l5 5 5-5" /></svg>
          </button>
          <button id="btn-list" class="icon-btn" data-i18n-title="list">
            <svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" /></svg>
          </button>
        </div>
      </footer>
      <div id="big" class="big" hidden><div id="big-text" class="big-text"></div></div>
    </main>


    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
