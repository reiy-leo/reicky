[package]
name = "reicky"
version = "0.1.0"
description = "跨平台桌面便签"
authors = ["Rei Leo"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "reicky_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
