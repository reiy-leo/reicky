name: build

# 只在推 v* tag 或手动触发时打包（私有仓库的 macOS runner 按 10 倍计费）
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux 依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      # 从 CHANGELOG.md 取当前版本那一节作为 Release 说明（tag v0.1.1 → "## [0.1.1]"）
      - name: Release notes
        id: notes
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          body="$(awk -v v="$ver" '/^## \[/{p=index($0,"## ["v"]")==1;next} p' CHANGELOG.md)"
          [ -n "$body" ] || body="见 CHANGELOG.md"
          { echo "body<<__NOTES__"; echo "$body"; echo "__NOTES__"; } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Google 同步用的桌面 OAuth 客户端，编译时写进二进制（仓库 Settings → Secrets → Actions）
          REICKY_GOOGLE_CLIENT_ID: ${{ secrets.REICKY_GOOGLE_CLIENT_ID }}
          REICKY_GOOGLE_CLIENT_SECRET: ${{ secrets.REICKY_GOOGLE_CLIENT_SECRET }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: reicky ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}
